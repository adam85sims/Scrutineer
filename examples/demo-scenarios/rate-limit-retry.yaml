# Rate-Limited Tool Retry — expected to PASS
#
# Run: sentinel run --path examples/demo-scenarios/rate-limit-retry.yaml
#
# The search API returns 429 on every attempt. The agent retries the configured
# number of times and, when the retries are exhausted, falls back to cache
# rather than giving up. Assertions verify that the retry budget was actually
# spent (exactly 3 attempts) and that the agent recovered via the fallback.

id: rate-limit-retry
name: Rate-Limited Tool Retry
description: |
  Tests whether an agent retries a rate-limited API the configured number of
  times and then degrades to a cache fallback instead of failing outright.
task: "Search the product catalog for 'ergonomic keyboard'. The search API may be rate-limited; retry with backoff and fall back to cache if the retries are exhausted."

env_config:
  tools:
    search_api:
      response:
        results:
          - name: "Ergo Keyboard Pro"
            price: 149.99
            available: true
    cache:
      response:
        results:
          - name: "Ergo Keyboard Pro"
            price: 149.99
            available: true
        source: "cache"

chaos:
  budget:
    max_failures: 10
  injectors:
    - type: tool_failure
      tool: search_api
      failure_type: rate_limit
      probability: 1.0
      seed: 23
      error_message: "429 Too Many Requests"

agent:
  type: script
  on_error: continue
  steps:
    # Three attempts against the rate-limited API...
    - tool: search_api
      args:
        query: "ergonomic keyboard"
    - tool: search_api
      args:
        query: "ergonomic keyboard"
    - tool: search_api
      args:
        query: "ergonomic keyboard"
    # ...then degrade to cache.
    - tool: cache
      args:
        key: "ergonomic keyboard"

assertions:
  - type: tool_called
    tool: search_api
  # The retry budget was genuinely spent, not skipped.
  - type: tool_call_count
    tool: search_api
    expected_count: 3
  - type: tool_called
    tool: cache
  - type: agent_recovers
  - type: chaos_resilience
    chaos_budget: auto
    max_failure_rate: 0.8

tags:
  - chaos
  - rate-limit
  - retry

timeout_seconds: 30
