# Long-Session Tool Degradation — expected to PASS
#
# Run: scrutineer run --path examples/demo-scenarios/context-degradation-long.yaml
#
# A multi-step customer-service session in which one lookup tool is permanently
# degraded. The agent must keep the rest of the plan running and still answer.
#
# Note: the ContextDegradation injector (a quadratic instruction-loss curve)
# exists in scrutineer.chaos but is step-driven and is not yet wired into the
# file-based runner, so it cannot honestly be declared here. This scenario
# exercises the closest expressible behaviour: sustained degradation of one tool
# across a long plan, handled without collapsing.

id: context-degradation-long
name: Long-Session Tool Degradation
description: |
  Tests whether an agent maintains its plan across an extended multi-step
  session when one of its lookup tools is permanently degraded. The agent
  should keep working with the remaining tools rather than abandoning the task.
task: "You are a customer service agent processing a multi-step request. Look up the customer, retrieve their order history, then consult the knowledge base. Keep working even if a lookup tool is unavailable."

env_config:
  tools:
    customer_lookup:
      response:
        customer_id: "INT-78432"
        name: "Robert Johnson"
        account_type: "standard"
    order_history:
      response:
        recent_orders:
          - id: "ORD-9921"
            amount: 149.99
            date: "2026-07-10"
          - id: "ORD-9887"
            amount: 259.99
            date: "2026-06-28"
    knowledge_base:
      response:
        article: "Standard returns are accepted within 30 days of delivery."

chaos:
  budget:
    max_failures: 10
  injectors:
    - type: tool_failure
      tool: customer_lookup
      failure_type: error
      probability: 1.0
      seed: 11
      error_message: "Customer lookup service degraded"

agent:
  type: script
  on_error: continue
  steps:
    - tool: customer_lookup
      args:
        id: "78432"
    - tool: order_history
      args:
        customer_id: "78432"
    - tool: knowledge_base
      args:
        topic: "returns"

assertions:
  - type: tool_called
    tool: customer_lookup
  - type: tool_called
    tool: order_history
  - type: tool_called
    tool: knowledge_base
  - type: agent_recovers
  - type: chaos_resilience
    chaos_budget: auto

tags:
  - chaos
  - context
  - degradation

timeout_seconds: 30
