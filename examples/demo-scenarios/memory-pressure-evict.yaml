# Critical State Under Partial Tool Failure — expected to PASS
#
# Run: sentinel run --path examples/demo-scenarios/memory-pressure-evict.yaml
#
# A non-critical lookup tool fails mid-transaction. The agent must preserve the
# critical steps (session, order, payment) and finish the transaction anyway.
#
# Note: the MemoryPressure injector (context eviction under a token budget) is
# not yet wired into the file-based runner, so this scenario expresses the
# closest available behaviour: partial failure of a non-critical tool while the
# critical path stays intact.

id: memory-pressure-evict
name: Critical State Under Partial Tool Failure
description: |
  Tests whether an order-processing agent can complete a transaction when a
  non-critical auxiliary tool fails, while all critical steps (session, order,
  payment) succeed. The agent should not abandon the transaction over a
  non-critical failure.
task: "Process an order while maintaining the authenticated session, the order state, and the payment selection. Keep going if an auxiliary lookup fails."

env_config:
  tools:
    session_manager:
      response:
        session_id: "sess_a1b2c3d4"
        user: "authenticated"
    order_service:
      response:
        order_id: "ORD-5521"
        total: 215.98
    inventory_service:
      response:
        in_stock: true
        reserve_id: "RSV-8832"
    payment_service:
      response:
        selected: "credit_card"
        last_four: "4242"

chaos:
  budget:
    max_failures: 10
  injectors:
    - type: tool_failure
      tool: inventory_service
      failure_type: error
      probability: 1.0
      seed: 19
      error_message: "Inventory check timed out under load"

agent:
  type: script
  on_error: continue
  steps:
    - tool: session_manager
      args:
        action: "init"
    - tool: order_service
      args:
        action: "create"
    - tool: inventory_service
      args:
        sku: "PREMIUM-WIDGET"
    - tool: payment_service
      args:
        action: "select"

assertions:
  - type: tool_called
    tool: session_manager
  - type: tool_called
    tool: order_service
  - type: tool_called
    tool: payment_service
  # The critical payment step still executed after the auxiliary failure.
  - type: agent_recovers
  - type: chaos_resilience
    chaos_budget: auto
  - type: no_silent_failure

tags:
  - chaos
  - memory
  - eviction

timeout_seconds: 30
