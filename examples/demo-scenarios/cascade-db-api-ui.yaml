# Cascading Database/API Failure — expected to PASS
#
# Run: scrutineer run --path examples/demo-scenarios/cascade-db-api-ui.yaml
#
# Models a dependency cascade: the database times out, the API that depends on
# it then fails, and the UI layer degrades to cached data. The agent keeps
# executing through both failures and recovers at the UI layer.
#
# Note: only the tool_failure injector is applied by the file-based runner
# today. The cascade is therefore expressed as two tool failures sequenced
# through the agent's plan, not via the CascadingFailures (step-driven)
# injector, which the file path cannot yet honour.

id: cascade-db-api-ui
name: Cascading Database and API Failure
description: |
  Simulates a cascading failure where a database timeout propagates through
  the API layer to the user interface. Tests whether the agent detects the
  failures, continues execution, and returns a degraded but useful result
  rather than complete failure.
task: "Fetch the user dashboard data for user ID 789. The dashboard needs the database, then the API, then the UI layer. Handle any failures and return partial results if possible."

env_config:
  tools:
    database:
      response:
        user:
          id: 789
          name: "Jane Smith"
          tier: "premium"
    api_server:
      response:
        orders: []
    user_interface:
      response:
        fallback_message: "Dashboard partially loaded. Some data unavailable."
        cached_profile:
          name: "Jane Smith"
          tier: "premium"

chaos:
  budget:
    max_failures: 10
  injectors:
    - type: tool_failure
      tool: database
      failure_type: timeout
      probability: 1.0
      seed: 7
      error_message: "Database connection timeout after 5000ms"
    - type: tool_failure
      tool: api_server
      failure_type: error
      probability: 1.0
      seed: 8
      error_message: "API unavailable: upstream dependency failed"

agent:
  type: script
  on_error: continue
  steps:
    - tool: database
      args:
        query: "user 789"
    - tool: api_server
      args:
        path: "/user/789/orders"
    - tool: user_interface
      args:
        view: "dashboard"

assertions:
  # Every layer in the chain was attempted, so both failures were exercised.
  - type: tool_called
    tool: database
  - type: tool_called
    tool: api_server
  # The agent did not stop at the first or second failure.
  - type: tool_called
    tool: user_interface
  - type: agent_recovers
  - type: chaos_resilience
    chaos_budget: auto
    max_failure_rate: 0.7

tags:
  - chaos
  - cascade
  - production

timeout_seconds: 30
