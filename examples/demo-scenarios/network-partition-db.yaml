# Primary Database Unreachable, Replica Fallback — expected to PASS
#
# Run: sentinel run --path examples/demo-scenarios/network-partition-db.yaml
#
# The primary database is unreachable (network partition). The agent must
# detect the failure and aggregate data from the regional replicas instead of
# giving up. Both replicas are used so the aggregate is as complete as possible.
#
# Note: the NetworkPartition injector returns a ChaosToolWrapper that must be
# substituted into the environment; the file-based runner does not support that
# yet, so the partition is applied as a tool_failure on the primary database.

id: network-partition-db
name: Primary Database Unreachable, Replica Fallback
description: |
  Simulates a network partition that makes the primary database unreachable.
  The agent should detect the failure, fall back to the regional replicas, and
  return an aggregated result rather than no result.
task: "Retrieve the current inventory status. The system has multiple warehouses and should aggregate data from all available sources. If the primary database is unreachable, use the regional replicas."

env_config:
  tools:
    primary_database:
      response:
        warehouse: "primary"
        items: []
    replica_east:
      response:
        warehouse: "east"
        items:
          - sku: "WH-E-001"
            product: "Widget Alpha"
            quantity: 234
          - sku: "WH-E-002"
            product: "Gadget Beta"
            quantity: 89
    replica_west:
      response:
        warehouse: "west"
        items:
          - sku: "WH-W-001"
            product: "Widget Alpha"
            quantity: 156
          - sku: "WH-W-002"
            product: "Gadget Beta"
            quantity: 201

chaos:
  budget:
    max_failures: 10
  injectors:
    - type: tool_failure
      tool: primary_database
      failure_type: error
      probability: 1.0
      seed: 17
      error_message: "Connection refused: network unreachable (10.0.1.50:5432)"

agent:
  type: script
  on_error: continue
  steps:
    - tool: primary_database
      args:
        query: "inventory"
    - tool: replica_east
      args:
        query: "inventory"
    - tool: replica_west
      args:
        query: "inventory"

assertions:
  - type: tool_called
    tool: primary_database
  - type: tool_called
    tool: replica_east
  - type: tool_called
    tool: replica_west
  - type: agent_recovers
  - type: chaos_resilience
    chaos_budget: auto

tags:
  - chaos
  - network
  - partition

timeout_seconds: 30
